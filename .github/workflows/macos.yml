name: macOS

on:
  push:
  pull_request:

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install GUI dependency
        run: brew install glfw

      - name: Fetch pinned Dear ImGui docking release
        run: ./setup_imgui.sh

      - name: Configure
        # POM68K_LTO=OFF is stated, not inherited. It used to come free with
        # NATIVE=OFF; since 2026-08-17 the default is ON, and turning it on
        # HERE would be a silent behaviour change on a path nobody has
        # exercised — LTO for the macOS build is open work with its own
        # reason for being open (the universal-2 lipo path, TODO.md § 3).
        # Flip this the day that item is done, not as a side effect.
        run: >-
          cmake -S . -B build
          -DPOM68K_NATIVE=OFF -DPOM68K_LTO=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI and portable gates
        run: >-
          cmake --build build --parallel 3 --target
          POM68K cpu_smoke savestate_test
          atalk_stack_test afp_server_test pap_server_test declrom_test

      # The AArch64 JIT proof, its metrics and their archive are suspended
      # while the JIT is compiled out (POM68K_JIT=OFF since 2026-11-23,
      # CLAUDE.md § JIT policy); restore them with the JIT.

      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure
          -R '^(cpu_smoke|savestate_test|atalk_stack_test|afp_server_test|pap_server_test|declrom_test)$'
