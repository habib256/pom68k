# Minimal CI: build POM68K on Linux and run the manifest's asset-free tier.
# `unit` is a legacy structural label and includes gates whose useful path
# soft-skips without a ROM, disk, firmware or external oracle corpus.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev

      - name: Fetch Dear ImGui (pinned to the tested docking release)
        run: git clone --depth 1 --branch v1.92.8-docking https://github.com/ocornut/imgui.git

      - name: Configure
        # POM68K_NATIVE=OFF: -march=native on a CI runner proves nothing and
        # LTO roughly doubles the link time for 100+ test binaries.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPOM68K_NATIVE=OFF

      - name: Fast native JIT proof (x86-64, asset-free)
        env:
          POM68K_JIT_REQUIRE_NATIVE: "1"
          POM68K_JIT_METRICS_FILE: ${{ runner.temp }}/pom68k-jit-x86_64.json
        run: |
          cmake --build build -j"$(nproc)" --target jitfast
          ctest --test-dir build -L jit-fast --output-on-failure

      - name: Publish x86-64 JIT metrics
        if: always()
        run: |
          test -f "${{ runner.temp }}/pom68k-jit-x86_64.json"
          python3 tools/check_jit_performance.py --require synthetic_68040_lockstep "${{ runner.temp }}/pom68k-jit-x86_64.json"
          cat "${{ runner.temp }}/pom68k-jit-x86_64.json"

      - name: Archive x86-64 JIT metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pom68k-jit-metrics-x86_64
          path: ${{ runner.temp }}/pom68k-jit-x86_64.json
          if-no-files-found: error

      - name: Build POM68K + all tests
        run: cmake --build build -j"$(nproc)"

      - name: Smoke-launch (--version exits before any window)
        run: |
          OUT=$(./build/POM68K --version)
          echo "$OUT"
          grep -q "Macintosh 68k emulator" <<<"$OUT"

      - name: Run the manifest-declared asset-free tier
        run: ctest --test-dir build -L asset-none --output-on-failure
