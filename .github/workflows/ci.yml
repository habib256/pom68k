# Minimal CI: build POM68K on Linux and run the manifest's asset-free tier.
# `unit` is a legacy structural label and includes gates whose useful path
# soft-skips without a ROM, disk, firmware or external oracle corpus.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev
          # The repo's tools venv: without machfs, dir2hfs_selftest soft-skips,
          # exits 0 and counts green -- and the census step below is strict.
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet machfs

      - name: Fetch Dear ImGui (pinned to the tested docking release)
        run: git clone --depth 1 --branch v1.92.8-docking https://github.com/ocornut/imgui.git

      - name: Configure
        # POM68K_NATIVE=OFF: -march=native on a CI runner proves nothing.
        # POM68K_LTO=OFF is now SEPARATE and deliberate: LTO roughly doubles
        # the link time of the ~130 test binaries, which is not what this job
        # is for. It used to come free with NATIVE=OFF, and that silent
        # coupling is exactly what was removed on 2026-08-17 — this job wants
        # no LTO, so it says no LTO. The `link-configs` job below is where
        # the LTO configurations are proved.
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPOM68K_NATIVE=OFF -DPOM68K_LTO=OFF -DPOM68K_WERROR=ON

      - name: Fast native JIT proof (x86-64, asset-free)
        env:
          POM68K_JIT_REQUIRE_NATIVE: "1"
          POM68K_JIT_METRICS_FILE: ${{ runner.temp }}/pom68k-jit-x86_64.json
        run: |
          cmake --build build -j"$(nproc)" --target jitfast
          ctest --test-dir build -L jit-fast --output-on-failure

      - name: Publish x86-64 JIT metrics
        if: always()
        run: |
          test -f "${{ runner.temp }}/pom68k-jit-x86_64.json"
          python3 tools/check_jit_performance.py --require synthetic_68040_lockstep "${{ runner.temp }}/pom68k-jit-x86_64.json"
          cat "${{ runner.temp }}/pom68k-jit-x86_64.json"

      - name: Archive x86-64 JIT metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pom68k-jit-metrics-x86_64
          path: ${{ runner.temp }}/pom68k-jit-x86_64.json
          if-no-files-found: error

      - name: Build POM68K + all tests
        # POM68K_WARNINGS is ON by default since 2026-08-27, and since
        # 2026-09-02 this job builds with -DPOM68K_WERROR=ON: the g++ 13
        # census reached zero on this exact recipe (37 warnings closed —
        # CHANGELOG 2026-09-02), so a new warning is now a red build, not a
        # line in a report. The census step below stays as the inventory's
        # eyes for the day something fires.
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee "${{ runner.temp }}/build.log"

      - name: GCC warning census (non-blocking)
        if: always()
        run: |
          LOG="${{ runner.temp }}/build.log"
          # A missing log means the build step never ran (the job failed
          # earlier); saying "0 warnings" then is the phantom-pass shape
          # this project keeps killing (docs/MEASURING.md R5). Say NO
          # CENSUS loudly instead — still non-blocking, never misleading.
          if [ ! -f "$LOG" ]; then
            echo "NO CENSUS: $LOG does not exist — the build step did not run"
            exit 0
          fi
          # Paths come out absolute or ../-relative depending on the
          # generator, so select by what is NOT ours instead.
          OURS=$(grep "warning:" "$LOG" | grep -v "extern/\|/imgui/" || true)
          echo "warnings in POM68K's own sources: $(printf '%s' "$OURS" | grep -c warning: || true)"
          printf '%s\n' "$OURS" | grep -o "\[-W[a-z0-9-]*\]" | sort | uniq -c | sort -rn || true
          printf '%s\n' "$OURS" | head -50

      - name: Smoke-launch (--version exits before any window)
        run: |
          OUT=$(./build/POM68K --version)
          echo "$OUT"
          grep -q "Macintosh 68k emulator" <<<"$OUT"

      - name: Run the manifest-declared asset-free tier
        run: ctest --test-dir build -L asset-none --output-on-failure

      - name: Every gate in that tier actually RAN
        # `--fail-on-skip` because this tier's whole claim is that it needs no
        # private asset: a soft-skip in it is either a missing tool the job
        # should install, or a gate that does not belong in the tier. Measured
        # on the dev host 2026-08-27: 86 executed, 0 skipped.
        if: always()
        run: python3 tools/gate_execution_census.py --build-dir build --fail-on-skip

  # Does the tree still LINK in the configurations it ships in, and in the
  # one a developer gets by typing `cmake ..`? The job above answers neither:
  # it asks for no LTO on purpose (link time), while the released Linux
  # binaries are built `-DPOM68K_LTO=ON`
  # (packaging/linux/build_in_bionic.sh) and `POM68K_LTO` now defaults ON.
  # Nor does that runner install lld or mold, so `POM68K_FAST_LINK` never
  # finds one to probe.
  #
  # That blind spot was not theoretical: on 2026-08-17 the tree did not build
  # AT ALL on a stock x86-64 host with GCC and ld.lld — GCC hands its LTO
  # objects to the linker as GIMPLE, lld is not given the plugin, and every
  # executable died on `undefined symbol: main` at 4 % of the build. Two
  # feature probes that each said yes; nothing probed the pair
  # (CHANGELOG.md 2026-08-17 (later)).
  #
  # Kept deliberately CHEAP, because the failure is a LINK failure and shows
  # up on the very first executable: this builds only the two standalone
  # gates that link nothing else, so it costs a compile and two links per
  # configuration instead of the ~20 minutes an LTO build of the core would
  # add to every push. What it therefore does NOT prove is that
  # `libpom68k_core.a` itself survives LTO — the full-suite LTO build stays
  # a manual/release concern.
  link-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LTO + fast linker (the developer default)
            flags: -DPOM68K_LTO=ON
          - name: LTO, default linker (the release shape)
            flags: -DPOM68K_LTO=ON -DPOM68K_FAST_LINK=OFF
          - name: no LTO + fast linker
            flags: -DPOM68K_LTO=OFF
    name: link (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # lld is the point of this job — without it POM68K_FAST_LINK finds
        # nothing and the combination under test cannot occur.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lld

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DPOM68K_NATIVE=OFF ${{ matrix.flags }} 2>&1 | tee configure.log
          grep -E 'POM68K: (linking with|ld\.| LTO)' configure.log || true

      - name: Build and run the standalone gates
        run: |
          cmake --build build -j"$(nproc)" --target docs_test config_test
          ctest --test-dir build -R '^(docs_test|config_test)$' --output-on-failure
