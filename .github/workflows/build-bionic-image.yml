# Builds packaging/linux/Dockerfile.bionic — the FROZEN glibc-2.27 release
# toolchain — for BOTH architectures and pushes them to ghcr.io:
#
#   ghcr.io/<owner>/pom68k-bionic-builder:bionic           (x86_64)
#   ghcr.io/<owner>/pom68k-bionic-builder:bionic-aarch64   (aarch64)
#
# One native job per arch — GitHub's ubuntu-24.04-arm runner builds the
# aarch64 image at full speed, no QEMU. This is the ONE place the flaky
# bionic-EOL apt/download steps run; a release then just `docker run`s the
# result (release.yml), off the mirror-outage critical path.
#
# Run manually after changing the Dockerfile, then pin the digests it prints
# into release.yml (BUILDER_IMAGE / BUILDER_IMAGE_ARM64).
name: Build bionic builder image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/linux/Dockerfile.bionic'
      - '.github/workflows/build-bionic-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            tag: bionic
          - runner: ubuntu-24.04-arm
            tag: bionic-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push the pinned builder image
        run: |
          set -euxo pipefail
          # Lowercase the owner — GHCR repositories must be lowercase.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/pom68k-bionic-builder"
          DATETAG="${{ matrix.tag }}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          docker build -f packaging/linux/Dockerfile.bionic \
            -t "${IMAGE}:${{ matrix.tag }}" -t "${IMAGE}:${DATETAG}" packaging/linux
          docker push "${IMAGE}:${{ matrix.tag }}"
          docker push "${IMAGE}:${DATETAG}"

      - name: Report the pushed digest (pin THIS in release.yml)
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/pom68k-bionic-builder"
          docker inspect --format='{{range .RepoDigests}}  digest: {{.}}{{"\n"}}{{end}}' "${IMAGE}:${{ matrix.tag }}"
          echo "To pin: set the matching BUILDER_IMAGE* in .github/workflows/release.yml to the digest above."
