# Nightly: does libpom68k_core.a survive LTO on both host architectures,
# and what do the sanitizers say about the tree?
#
# The gap this closes. `ci.yml` has two jobs and neither answers it:
#   - `linux` asks for -DPOM68K_LTO=OFF on purpose, because LTO roughly
#     doubles the link time of the ~150 binaries and that is not what a
#     per-push job is for.
#   - `link-configs` builds only the two standalone gates that link nothing
#     else. That is enough to catch a broken linker/LTO pairing on the very
#     first executable, and it says so in its own comment, but it never links
#     the core.
# Meanwhile the released Linux binaries ARE built -DPOM68K_LTO=ON
# (packaging/linux/build_in_bionic.sh), and since 2026-08-17 POM68K_LTO
# defaults ON, so a plain `cmake ..` is this shape too. Nothing was proving it.
#
# Both architectures, deliberately. The dev host is AArch64 and CI was
# x86-64, and that split is exactly how the tree came to not build at all on
# a stock x86-64 host (CHANGELOG.md 2026-08-17 (later)): a configuration
# nobody exercised. A nightly is the cheap place to stop repeating that.
#
# Cost, measured rather than guessed. This exact configuration -- release
# shape, `--parallel 4` on 4 cores / 15 GB -- built all 152 binaries in
# **87 minutes**, exit 0, no OOM (2026-08-17, GUI target excluded: that host
# had no OpenGL dev packages, so add headroom for it). That is why the job is
# nightly and manual-only, never per-push, and why the ceiling below is 240
# and not 180: 87 min leaves a slower or busier runner far too little margin,
# and a timeout on a nightly costs a whole night. `-flto=auto` spawns its own
# LTRANS jobs per link on top of the make parallelism; if a runner ever does
# OOM here, lower --parallel before suspecting the code.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lto-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    name: LTO core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # No lld or mold on purpose: the released Linux binaries go through
        # packaging/linux/build_in_bionic.sh, which installs neither, so the
        # shape under test here is LTO + the default linker. The lld/mold
        # question belongs to ci.yml's `link-configs`, which owns it.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev

      - name: Fetch Dear ImGui (pinned to the tested docking release)
        run: git clone --depth 1 --branch v1.92.8-docking https://github.com/ocornut/imgui.git

      - name: Configure (the release shape)
        # POM68K_NATIVE=OFF + POM68K_LTO=ON is what a distributable build is:
        # no ISA floor raised, but the cross-TU inlining kept. Both are stated
        # rather than inherited -- inheriting is what cost the release
        # binaries their LTO in the first place.
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPOM68K_NATIVE=OFF -DPOM68K_LTO=ON

      - name: Build everything under LTO
        run: cmake --build build --parallel "$(nproc)"

      - name: The core is real, not an empty archive
        run: |
          ls -l build/libpom68k_core.a
          test -s build/libpom68k_core.a
          # A 0-byte binary passing for a built one is a trap this project has
          # already paid for; check the whole output, not just the archive.
          empty=$(find build -maxdepth 1 -type f -executable -size 0 | wc -l)
          echo "0-byte executables: $empty"
          test "$empty" -eq 0

      - name: Smoke-launch (--version exits before any window)
        run: |
          OUT=$(./build/POM68K --version)
          echo "$OUT"
          grep -q "Macintosh 68k emulator" <<<"$OUT"

      - name: Run the asset-free tier against the LTO build
        # Linking is not behaving: LTO reorders and inlines across translation
        # units, so the tier is re-run here rather than assumed. Parallel is
        # safe because every gate now declares its scheduling cost
        # (gate_resource_budgets.tsv -> PROCESSORS).
        run: ctest --test-dir build -L asset-none -j "$(nproc)" --output-on-failure

      - name: Keep the build log when it breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-lto-${{ matrix.arch }}-logs
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  # ── Sanitizers ────────────────────────────────────────────────────────
  # POM68K_SANITIZE existed since the POM2 days and NO job had ever used it
  # (TODO.md section 0.B item 2, from the 2026-08-26 review). This is that job.
  #
  # Measured on the dev host (aarch64/macOS, clang) before being written here,
  # because a CI leg nobody has seen pass is not a guard:
  #   - address,undefined over `-L asset-none`: 85/85, zero sanitizer reports.
  #   - thread over the two gates that own the only real concurrency in the
  #     tree: it found a genuine data race on the first run -- the machine
  #     THREAD bumping the test harness's plain `int quanta` while the main
  #     thread spun on it (machinehost_test, fixed by making the counters
  #     atomic). MachineHost itself was clean.
  #
  # Two deliberate choices, both of which would otherwise look like an
  # oversight:
  #   - the ASan leg does NOT force POM68K_CPU_ENGINE. The first local attempt
  #     did, reasoning that generated code deserves its own experiment, and it
  #     broke `jit_store_guard_a64_test`, whose whole subject is that native
  #     code got compiled. The JIT under ASan is what this leg should exercise,
  #     and it is clean.
  #   - detect_leaks=0 for now. LeakSanitizer is on by default with ASan on
  #     Linux and off on macOS, so the local runs never saw it; leaks are a
  #     separate hunt with its own triage, and turning it on blind would make
  #     the leg's first CI appearance a wall of noise nobody reads.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address,undefined
            name: asan-ubsan
          - san: thread
            name: tsan
    name: Sanitizer (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev xvfb
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet machfs

      - name: Fetch Dear ImGui (pinned to the tested docking release)
        run: git clone --depth 1 --branch v1.92.8-docking https://github.com/ocornut/imgui.git

      - name: Configure
        # RelWithDebInfo, not Release: a sanitizer report without line numbers
        # costs more time than the leg saves. No LTO, no native ISA.
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPOM68K_NATIVE=OFF -DPOM68K_LTO=OFF
          -DPOM68K_SANITIZE=${{ matrix.san }}

      - name: Build (whole tree for ASan, the two concurrency gates for TSan)
        run: |
          if [ "${{ matrix.name }}" = "tsan" ]; then
            cmake --build build -j"$(nproc)" --target machinehost_test POM68K
          else
            cmake --build build -j"$(nproc)"
          fi

      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # GCC's ASan disables stack-slot reuse, so a test whose call tree
          # holds several ~1.1 MB CPU wrappers (Moira's opcode tables) adds
          # its frames instead of sharing them: savestate_040_test's five
          # inlined family rigs reached ~16 MB against the 8 MB default and
          # died as stack-overflow the first night this leg ever RAN
          # (2026-09-02, run 33659529760 — with jit_restart_write_030_test
          # and jit_asset_free_lockstep_test, same shape). The binaries are
          # sound under the normal limit in every other job; only the
          # instrumented leg gets the wider stack.
          ulimit -s 65532
          if [ "${{ matrix.name }}" = "tsan" ]; then
            ctest --test-dir build -R "machinehost_test|gui_smoke_test" \
                  --output-on-failure
          else
            ctest --test-dir build -L asset-none -j "$(nproc)" \
                  --output-on-failure
          fi

      - name: Leak census
        # LeakSanitizer is on by default with ASan on Linux and ABSENT on
        # macOS/arm64, so the dev host could never run this leg. What it CAN
        # run is the platform's own tool, and it did (2026-08-27):
        # `leaks --atExit` over all 78 asset-free gate binaries reported
        # 0 leaks for 0 bytes, and the GUI binary's 288 leaks are entirely
        # Apple's -- NSXPCConnection root cycles from AppIntents/LinkServices,
        # with not one POM68K frame in any stack.
        #
        # The first Linux report was read on 2026-09-03 (run 33686489995,
        # the ASan leg's first fully green night): 84/84 under
        # detect_leaks=1, not one LeakSanitizer line. Blocking since, as
        # promised — the flip was one word, exactly like -Werror in ci.yml.
        if: matrix.name == 'asan-ubsan'
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: print_suppressions=0
        run: |
          set -o pipefail
          ulimit -s 65532        # same additive-frame arithmetic as Run above
          ctest --test-dir build -L asset-none -j "$(nproc)" \
                --output-on-failure 2>&1 \
            | tee "${{ runner.temp }}/leak-census.log"

      - name: Archive the leak census
        # The report the TODO § 1.3 flip waits on: reading THIS artifact once
        # is the precondition for dropping continue-on-error above.
        if: always() && matrix.name == 'asan-ubsan'
        uses: actions/upload-artifact@v4
        with:
          name: pom68k-leak-census
          path: ${{ runner.temp }}/leak-census.log
          if-no-files-found: warn

      - name: Which gates actually ran
        # A soft-skipped gate exits 0 and is counted green, so the tally alone
        # cannot say whether the sanitizer exercised anything.
        #
        # The asan-ubsan leg runs `-L asset-none` and holds it to
        # --fail-on-skip, so it carried the same defect ci.yml did: four
        # gates needing a private asset or an AArch64 host sat in the
        # asset-free tier and abstained here. Both were fixed in the registry
        # on 2026-09-02 (cmake/Pom68kGatePolicy.cmake's optional-asset list
        # and the host-conditional a64 registration) rather than by weakening
        # the flag. Expected on these x86-64 runners: 84 executed,
        # 0 soft-skipped. The tsan leg selects two gates by name instead, so
        # it censuses without the flag.
        if: always()
        run: |
          if [ "${{ matrix.name }}" = "tsan" ]; then
            python3 tools/gate_execution_census.py --build-dir build
          else
            python3 tools/gate_execution_census.py --build-dir build --fail-on-skip
          fi

  # ── Coverage ──────────────────────────────────────────────────────────
  # Third item of the 2026-08-26 review. The artifact is not a badge: the
  # number that matters is `coverage-zero.txt`, the src/ files the asset-free
  # tier never executes, because that list IS the inventory of what only the
  # private ROM/disk assets prove. Measured on the dev host 2026-08-27 (clang,
  # llvm-cov): 28.93 % of product lines, 48 files never reached — among them
  # five of the ten CPU wrappers (Cpu020, IIfxCpu, MscCpu, RbvCpu, SonoraCpu,
  # VaspCpu) while Cpu68k reads 94.87 % and Cpu040 72.55 %.
  #
  # A percentage moves when a test file grows. The zero list moves only when
  # the product's reachable surface changes, which is the thing worth watching
  # from one night to the next.
  coverage:
    name: Coverage (asset-free tier)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev xvfb
          pip install --user gcovr
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet machfs

      - name: Fetch Dear ImGui (pinned to the tested docking release)
        run: git clone --depth 1 --branch v1.92.8-docking https://github.com/ocornut/imgui.git

      - name: Configure
        run: >-
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPOM68K_NATIVE=OFF -DPOM68K_LTO=OFF -DPOM68K_COVERAGE=ON

      - name: Build
        run: cmake --build build-cov -j"$(nproc)"

      - name: Report
        run: tools/coverage_report.sh build-cov asset-none

      - name: Archive the coverage tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pom68k-coverage-asset-none
          path: |
            build-cov/coverage.txt
            build-cov/coverage-files.tsv
            build-cov/coverage-zero.txt
          if-no-files-found: error
