# Identity of the CPU vector corpora (tools/verify_sst_corpora.py).
# The files live in git-ignored tests/data/<corpus>/; this manifest is what
# makes two hosts' green runs the same claim.
#
# sst68000 — SingleStepTests/680x0, 68000/v1, upstream commit
#   e0d5ece9670205cc84a0101081837deb446f86a3 (2024-05-14, the only commit that
#   touches that directory). 124 files x 8 065 vectors, stored upstream as
#   .json.gz; the hashes below are of the unpacked .json.
#   Fetch: tests/fetch_sst_68000.sh tests/data/sst68000
# sst68030 — generated here by oracle/fuzz (gen030.py, fuzz030.py) against the
#   WinUAE oracle of oracle/uae (Hatari e77819f7). 3 082 vectors. Several
#   cells date from the two-oracle period and keep only vectors on which the
#   retired Musashi oracle agreed (oracle/fuzz/disputes/NOTES.md); the fpu
#   cells are WinUAE-solo (ruling D22). Seeds are in each vector's name
#   ("core/identity seed=31 #1"). Permissive oracle setting; replayed with
#   `sst68030 --known tests/sst68030.known` (four vectors, ruling D23b).
# sst68030_solo — the same generator, WinUAE alone, all fourteen cells
#   (mmu_tt and random_tt included), generated 2026-11-06 and regenerated
#   2026-11-07 against the STRICT oracle (six vectors changed, all D23b).
#   5 592 vectors, reproducible from the tree: for each family in core, mmu,
#   random, fpu and each mmu in off, identity, tt, in that order, seeds 701
#   to 712, then fault with identity (713) and tt (714):
#         oracle/fuzz/fuzz030.py --a liboracle_uae.so --family F --mmu M
#         --strict-fpu --n 400 --seed S --out F_M.json
#   (eight vectors on which the oracle halts are skipped by the driver).
# sst68030_fpuraw — the raw cpID-1 window ($F200-$F37F, unconstrained
#   extension words) on the 68030 + 68882, against the STRICT oracle
#   (oracle_set_fpu_strict: opmodes $40-$7F take a Line-F, FRESTORE refuses
#   a 68040 frame), generated 2026-11-07. 6 000 vectors: for each mmu in
#   off, identity, tt, seeds 721 to 723:
#         oracle/fuzz/fuzz030.py --a liboracle_uae.so --family fpuraw --mmu M
#         --strict-fpu --n 2000 --seed S --out fpuraw_M.json
#   Replayed with `sst68030 --known tests/sst68030_fpuraw.known`: 194 of
#   them are rulings the fork does not follow the oracle on (D23b, D26-D29).
# sst68030_fpu2 — TWO instructions per vector ("steps": 2) on the 68030 +
#   68882, strict oracle: an FPU instruction, then one that decides when a
#   posted exception is delivered; FPCR enables armed seven times in ten.
#   Generated 2026-11-07, 6 000 vectors: for each mmu in off, identity, tt,
#   seeds 941 to 943:
#         oracle/fuzz/fuzz030.py --a liboracle_uae.so --family fpu2 --mmu M
#         --strict-fpu --steps 2 --n 2000 --seed S --out fpu2_M.json
#   Replayed with `sst68030 --known tests/sst68030_fpu2.known` (21 vectors,
#   all ruling D23b).
# sst68030_rmw — integer instructions whose LAST access is a write to memory
#   through an address register aimed at a bad page (ALU to memory, ADDQ,
#   immediates, NEG/NOT/CLR, bit operations, memory shifts, Scc, TAS, NBCD,
#   ABCD/SBCD/ADDX/SUBX -(Ay),-(Ax), MOVE Dn). Generated 2026-11-07, 6 000
#   vectors: identity seed 1201, tt seed 1202:
#         oracle/fuzz/fuzz030.py --a liboracle_uae.so --family rmw --mmu M
#         --strict-fpu --n 3000 --seed S --out rmw_M.json
#   Replayed with `sst68030 --known tests/sst68030_rmw.known` (empty since
#   2026-11-10: the SUB/SUBI data output buffer is unmasked, row 84).
# sst68040 — generated here by oracle/fuzz (gen040.py, fuzz040.py) against the
#   same oracle in 68040 mode, 68LC040 (no FPU). 7 200 vectors.
# sst68040_8k — the same, with 8 KB pages (TC.P = 1), generated 2026-11-06.
#   4 000 vectors, reproducible from the tree: for each family in core, mmu,
#   random, fault and each mmu in identity, tt, in that order, seeds 601 to
#   608:  oracle/fuzz/fuzz040.py --a liboracle_uae.so --family F --mmu M
#         --page 8k --n 500 --seed S --out F_M_8k.json
# sst68040_fline — the raw cpID-1 window ($F200-$F37F, unconstrained
#   extension words) on the FPU-less 68LC040, generated 2026-11-07. 4 500
#   vectors: for each mmu in off, identity, tt, seeds 951 to 953:
#         oracle/fuzz/fuzz040.py --a liboracle_uae.so --family fline --mmu M
#         --n 1500 --seed S --out fline_M.json
# sst68040_fpu — the full 68040 with its integrated FPU, generated
#   2026-11-07. 7 500 vectors: the assembler-shaped family, seeds 901 to 903,
#   then the raw one, seeds 961 to 963, each over off, identity, tt:
#         oracle/fuzz/fuzz040.py --a liboracle_uae.so --family fpu --mmu M
#         --n 1000 --seed S --out fpu_M.json
#         oracle/fuzz/fuzz040.py --a liboracle_uae.so --family fpuraw --mmu M
#         --n 1500 --seed S --out fpuraw_M.json
#   Replayed with `sst68040 --fpu --known tests/sst68040_fpu.known`: 44 of
#   them are open rulings (D25-D27) the fork does not follow the oracle on.
# sst68040_fpu2 — TWO instructions per vector ("steps": 2) on the full
#   68040: an FPU instruction, then one that decides when a posted exception
#   is delivered; FPCR enables armed seven times in ten. Generated
#   2026-11-07, 6 000 vectors: for each mmu in off, identity, tt, seeds 931
#   to 933:
#         oracle/fuzz/fuzz040.py --a liboracle_uae.so --family fpu2 --mmu M
#         --steps 2 --n 2000 --seed S --out fpu2_M.json
#   Replayed with `sst68040 --fpu --known tests/sst68040_fpu2.known` (no
#   vector listed at present).
# sst68040_fpuh — THREE steps per vector on the full 68040: an FPU
#   instruction, an FNOP, and `FSAVE -(A7)` planted as the first word of the
#   handlers of vectors 48 to 55, so that the state frame a handler reads is
#   in the vector. Generated 2026-11-07, 6 000 vectors: for each mmu in off,
#   identity, tt, seeds 1301 to 1303:
#         oracle/fuzz/fuzz040.py --a liboracle_uae.so --family fpuh --mmu M
#         --steps 3 --n 2000 --seed S --out fpuh_M.json
#   Replayed with `sst68040 --fpu --known tests/sst68040_fpuh.known` (12
#   vectors: the source tag of a dyadic instruction with a packed operand).
#
